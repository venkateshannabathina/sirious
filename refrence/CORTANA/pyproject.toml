[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cortana-companion-studio"
version = "1.0.0"
description = "Three.js CC3 companion, facial studio, voice pipeline, and world editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "groq==1.4.0",
    "python-dotenv==1.2.2",
    "edge-tts==7.2.8",
    "pydantic==2.13.4",
    "openai==2.46.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

